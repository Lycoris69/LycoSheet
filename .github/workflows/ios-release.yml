name: iOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ios-framework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS frameworks
        run: |
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
          ./gradlew :shared:linkReleaseFrameworkIosX64 --no-daemon
          ./gradlew :shared:linkReleaseFrameworkIosSimulatorArm64 --no-daemon

      - name: Assemble XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework shared/build/bin/iosArm64/releaseFramework/Shared.framework \
            -framework shared/build/bin/iosX64/releaseFramework/Shared.framework \
            -framework shared/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework \
            -output shared/build/Shared.xcframework

      - name: Zip and rename
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cd shared/build
          zip -r "LycoSheet-${TAG}.xcframework.zip" Shared.xcframework
          echo "ASSET=shared/build/LycoSheet-${TAG}.xcframework.zip" >> $GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
