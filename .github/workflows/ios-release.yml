name: iOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ios-framework:
    name: Build iOS XCFramework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble XCFramework
        # The KMP XCFramework DSL merges iosSimulatorArm64 + iosX64 into a
        # fat simulator slice automatically, then calls xcodebuild for us.
        # --max-workers=1 prevents the three link tasks from running in parallel
        # and exhausting the Kotlin/Native compiler daemon heap.
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --no-daemon --max-workers=1

      - name: Zip and rename
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          cd shared/build/XCFrameworks/release
          zip -r "LycoSheet-${TAG}.xcframework.zip" Shared.xcframework
          echo "ASSET=shared/build/XCFrameworks/release/LycoSheet-${TAG}.xcframework.zip" >> $GITHUB_ENV

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
