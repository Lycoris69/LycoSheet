name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Android APK ────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          mv androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
             androidApp/build/outputs/apk/release/LycoSheet-${TAG}.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/release/LycoSheet-*.apk
          generate_release_notes: true

  # ── iOS KMM Framework ──────────────────────────────────────────────────────
  ios-framework:
    name: Build iOS KMM Framework
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Shared.framework (arm64 release)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Build Shared.framework (x64 simulator)
        run: ./gradlew :shared:linkReleaseFrameworkIosX64 --no-daemon

      - name: Assemble XCFramework
        run: |
          xcodebuild -create-xcframework \
            -framework shared/build/bin/iosArm64/releaseFramework/Shared.framework \
            -framework shared/build/bin/iosX64/releaseFramework/Shared.framework \
            -output shared/build/Shared.xcframework
          TAG=${GITHUB_REF#refs/tags/}
          cd shared/build
          zip -r Shared-${TAG}.xcframework.zip Shared.xcframework

      - name: Upload XCFramework to release
        uses: softprops/action-gh-release@v2
        with:
          files: shared/build/Shared-*.xcframework.zip
          generate_release_notes: false
